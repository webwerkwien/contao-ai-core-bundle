# Geladen von ContaoAiCoreBundle::loadExtension() nur wenn
# terminal42/contao-changelanguage installiert ist (v1.4.0).
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Webwerkwien\ContaoAiCoreBundle\Service\Language\ChangeLanguageLinks: ~
    # v1.11.1: warum changelanguage keinen Artikel anbietet (link, check)
    Webwerkwien\ContaoAiCoreBundle\Service\Language\LinkTargetDiagnosis: ~
    Webwerkwien\ContaoAiCoreBundle\Command\LanguageLinkCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\LanguageCheckCommand: ~
    # v1.11.0; content:find nimmt den Dienst optional (null ohne changelanguage)
    Webwerkwien\ContaoAiCoreBundle\Service\Language\LanguageVersions: ~
    Webwerkwien\ContaoAiCoreBundle\Command\LanguageVersionsCommand: ~
