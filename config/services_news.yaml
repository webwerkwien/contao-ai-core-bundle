# Loaded by ContaoAiCoreBundle::loadExtension() only when \Contao\NewsModel
# (contao/news-bundle) is installed.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Auto-tag every cloner from this file. _instanceof only applies per file scope,
    # hence repeated here (same pattern for future services_calendar.yaml etc.).
    _instanceof:
        Webwerkwien\ContaoAiCoreBundle\Service\Cloner\EntityClonerInterface:
            tags: ['contao_ai.entity_cloner']

    Webwerkwien\ContaoAiCoreBundle\Command\NewsCreateCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsReadCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsUpdateCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsDeleteCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsRepairHeadlinesCommand: ~

    # tl_news_archive — the parent node. Belongs to the same bundle as tl_news
    # and therefore must not be registered without the news-bundle either.
    Webwerkwien\ContaoAiCoreBundle\Command\NewsArchiveCreateCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsArchiveReadCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsArchiveUpdateCommand: ~
    Webwerkwien\ContaoAiCoreBundle\Command\NewsArchiveDeleteCommand: ~

    Webwerkwien\ContaoAiCoreBundle\Service\Cloner\NewsArchiveCloner: ~
