services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Auto-tag every EntityCloner from this file (PageCloner, since page/article/content
    # belong to contao/core-bundle and are always loaded). Plugin-dependent cloners
    # in services_<plugin>.yaml each have their own _instanceof (per-file scope).
    _instanceof:
        Webwerkwien\ContaoAiCoreBundle\Service\Cloner\EntityClonerInterface:
            tags: ['contao_ai.entity_cloner']

    Webwerkwien\ContaoAiCoreBundle\:
        resource: ../src
        # Plugin-dependent commands are excluded from auto-discovery
        # and loaded in services_{news,calendar,faq,comments}.yaml,
        # only when the respective Contao bundle (news, calendar, faq, comments)
        # is actually installed (see ContaoAiCoreBundle::loadExtension).
        exclude:
            - ../src/{ContaoManager,ContaoAiCoreBundle.php,DependencyInjection}
            # Not a service of its own: RedactingConsoleErrorListenerPass puts the class
            # on Symfony's console.error_listener. Registered here as well, it would be
            # a second subscriber and log every console error twice.
            - ../src/EventListener/{RedactingConsoleErrorListener.php,RedactedConsoleError.php}
            - ../src/Command/News*.php
            - ../src/Command/Event*.php
            # The calendar commands (tl_calendar) depend on the calendar-bundle
            # just like the event commands, but are not named Event*.
            # Without this line auto-discovery registers them on every
            # installation — including one without a calendar. Noticed in a live
            # check: 4 of 12 new commands were registered, and precisely the
            # wrong four. PluginCommandRegistrationTest now turns this into a
            # red test instead of a rule to remember.
            - ../src/Command/Calendar*.php
            - ../src/Command/Faq*.php
            - ../src/Command/Comment*.php
            # Newsletter*.php is already covered by News*.php above —
            # fnmatch("News*.php", "NewsletterCreateCommand.php") matches.
            # Still a line of its own: the newsletter commands depend on the
            # newsletter-bundle, not the news-bundle, and would otherwise silently
            # slip through as soon as the News pattern is ever narrowed.
            - ../src/Command/Newsletter*.php
            # Depend on the package terminal42/contao-changelanguage, see services_changelanguage.yaml.
            - ../src/Command/Language*.php
            - ../src/Service/Language
            # Cloners are plugin-dependent and registered in services_<plugin>.yaml.
            - ../src/Service/Cloner/EntityClonerInterface.php
            - ../src/Service/Cloner/News*.php
            - ../src/Service/Cloner/Calendar*.php
            - ../src/Service/Cloner/FaqCategory*.php
            # Already covered by News*.php, a line of its own for the same reason as
            # the newsletter commands above.
            - ../src/Service/Cloner/Newsletter*.php
            # Value classes of contao:ai:apply, not services.
            - ../src/Service/Apply

    Webwerkwien\ContaoAiCoreBundle\Command\FolderCreateCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\FileDeleteCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\FileMoveCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\TemplateDeleteCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\FolderPublishCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\FileProcessCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\FileReadCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\FileWriteCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\TemplateListCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\TemplateReadCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Webwerkwien\ContaoAiCoreBundle\Command\TemplateWriteCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Contao 5.7 and 6.0 invalidate through contao.cache.tag_manager; 5.3 has none,
    # and its DataContainer::invalidateCacheTags() calls fos_http_cache.cache_manager
    # directly. `@?` passes null for whichever the installation lacks.
    Webwerkwien\ContaoAiCoreBundle\Service\Cache\CacheTagInvalidator:
        arguments:
            $tagManager: '@?contao.cache.tag_manager'
            $cacheManager: '@?fos_http_cache.cache_manager'

    # The write path behind its interface. Autowiring does not alias an interface
    # to its single implementation on its own, and without this every command's
    # #[Required] setRecordWriter() fails to resolve at compile time.
    Webwerkwien\ContaoAiCoreBundle\Service\Writer\RecordWriterInterface:
        alias: Webwerkwien\ContaoAiCoreBundle\Service\Writer\ModelWriter
